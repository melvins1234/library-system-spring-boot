system.servlet.context-path=/api/library

spring.application.name=library_system

# === Database Connection (required) ===
spring.datasource.url=jdbc:mysql://localhost:3306/library_system
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Optional: connection pool tuning (HikariCP is default)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# === JPA / Hibernate core settings ===
# MySQLDialect, SQLServerDialect, OracleDialect, etc.
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# none / validate / update / create / create-drop
spring.jpa.hibernate.ddl-auto=validate
# Log SQL statements (useful for dev)
spring.jpa.show-sql=true
# Pretty-print SQL in logs
spring.jpa.properties.hibernate.format_sql=true

# Very common in development (shows parameter values)
logging.level.org.hibernate.orm.jdbc.bind=trace

# Disable Open Session/EntityManager In View anti-pattern (strongly recommended)
spring.jpa.open-in-view=false